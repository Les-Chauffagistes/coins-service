name: CI
 
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

 
jobs:
  build-push:
    uses: Les-Chauffagistes/deploy/.github/workflows/build.yml@develop
    with:
      service-name: coins-service
    secrets:
      REGISTRY_USER:     ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
 
 