name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:


jobs:
  test:
    uses: Les-Chauffagistes/deploy/.github/workflows/test.yml@9f247961240048bbf11a3a3663396cf9122c55d7
    with:
      python-version: '3.12'
    secrets: inherit


  build-push:
    if: github.event_name == 'push'
    needs: test
    uses: Les-Chauffagistes/deploy/.github/workflows/build.yml@9f247961240048bbf11a3a3663396cf9122c55d7
    with:
      service-name: coins-service
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      VERDACCIO_PASSWORD: ${{ secrets.VERDACCIO_PASSWORD }}
      PYPISERVER_PASSWORD: ${{ secrets.PYPISERVER_PASSWORD }}
      ORG_PAT: ${{ secrets.ORG_PAT }}