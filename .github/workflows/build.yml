name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:


jobs:
  test:
    uses: Les-Chauffagistes/deploy/.github/workflows/test.yml@2e32eae14ae1affc59d3b271735fb5fb0e7e4fb3
    with:
      python-version: '3.12'


  build-push:
    if: github.event_name == 'push'
    needs: test
    uses: Les-Chauffagistes/deploy/.github/workflows/build.yml@f2251700b5b235a3965d6bb793a63e63cd43e673
    with:
      service-name: coins-service
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      VERDACCIO_PASSWORD: ${{ secrets.VERDACCIO_PASSWORD }}
      PYPISERVER_PASSWORD: ${{ secrets.PYPISERVER_PASSWORD }}
      ORG_PAT: ${{ secrets.ORG_PAT }}